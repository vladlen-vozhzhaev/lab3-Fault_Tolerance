server:
  port: 8080

spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false

rating-url: ${RATING_URL:http://localhost:8050}
library-url: ${LIBRARY_URL:http://localhost:8060}
reservation-url: ${RESERVATION_URL:http://localhost:8070}

resilience4j:
  circuitbreaker:
    instances:
      ratingClient:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 3s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
      libraryClient:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 3s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
      reservationClient:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 3s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    instances:
      ratingClient:
        timeoutDuration: 3s
        cancelRunningFuture: true
      libraryClient:
        timeoutDuration: 3s
        cancelRunningFuture: true
      reservationClient:
        timeoutDuration: 3s
        cancelRunningFuture: true

logging:
  level:
    io.github.resilience4j: INFO
    ru.rsoi.gateway: DEBUG